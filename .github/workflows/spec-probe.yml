# TEMPORARY — validates the spec source URLs in codegen/fetch.go against the
# live Dev Portal and discovers the fusion/fusion-plus sub-API slugs. Prints
# only status codes, titles, versions, and path counts (no spec bodies, no
# token). Delete this file once specSources is fully confirmed.
name: Spec source probe (temporary)

on:
  push:
    branches: [codegen-hardening]
    paths:
      - .github/workflows/spec-probe.yml
      - codegen/fetch.go

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Probe index endpoints
        env:
          TOKEN: ${{ secrets.DEV_PORTAL_TOKEN }}
        run: |
          for path in "/portal/apis" "/portal/apis/swagger" "/portal/apis/list"; do
            code=$(curl -s -o /tmp/idx -w "%{http_code}" --max-time 15 \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
              "https://api.1inch.dev$path" || echo "ERR")
            echo "== $code $path"
            # Print only short JSON summaries, never HTML dumps
            jq -r 'if type=="array" then .[:40] else (keys? // "non-object") end' /tmp/idx 2>/dev/null | head -50 || echo "(not JSON)"
          done

      - name: Probe candidate slugs
        env:
          TOKEN: ${{ secrets.DEV_PORTAL_TOKEN }}
        run: |
          probe() {
            local slug="$1"
            local code title version paths
            code=$(curl -s -o /tmp/spec -w "%{http_code}" --max-time 20 \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
              "https://api.1inch.dev/portal/apis/swagger/$slug" || echo "ERR")
            title=$(jq -r '.info.title // "?"' /tmp/spec 2>/dev/null || echo "not-json")
            version=$(jq -r '.info.version // "?"' /tmp/spec 2>/dev/null || echo "?")
            paths=$(jq -r '.paths | keys | length' /tmp/spec 2>/dev/null || echo "?")
            printf "%s  %-28s title=%s version=%s paths=%s\n" "$code" "$slug" "$title" "$version" "$paths"
          }
          for slug in \
            swap balance gas-price history nft orderbook portfolio spot-price \
            token traces tx-gateway web3 \
            fusion fusion-orders fusion-quoter fusion-relayer \
            fusion/orders fusion/quoter fusion/relayer \
            fusion-plus fusionplus fusion-plus-orders fusion-plus-quoter fusion-plus-relayer \
            fusion-plus/orders fusion-plus/quoter fusion-plus/relayer \
            crosschain cross-chain intent-swap; do
            probe "$slug"
          done

      - name: Fetch configured specs (validation only, nothing committed)
        env:
          DEV_PORTAL_TOKEN: ${{ secrets.DEV_PORTAL_TOKEN }}
        run: |
          go run ./codegen/cmd/fetch-specs || true
          echo "== working-tree diff after fetch =="
          git diff --stat
