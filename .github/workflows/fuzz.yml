# Weekly fuzzing of the decoders that parse untrusted data (on-chain
# extensions, calldata, and API responses). Seed corpora run in every normal
# `go test`; this workflow additionally explores new inputs. A finding is a
# panic — the corpus entry is printed in the log for reproduction.
name: Fuzz decoders

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Fuzz each target
        run: |
          set -euo pipefail
          # Discover all fuzz targets and run each for a bounded time.
          failures=0
          while read -r pkg target; do
            echo "=== $target ($pkg)"
            if ! go test -run='^$' -fuzz="^${target}\$" -fuzztime=90s "$pkg"; then
              failures=$((failures + 1))
            fi
          done < <(grep -rE '^func Fuzz[A-Za-z0-9]+\(' --include='*_test.go' . \
                   | sed -E 's|^\.?/?(.+)/[^/]+\.go:func (Fuzz[A-Za-z0-9]+)\(.*$|./\1 \2|' | sort -u)
          exit "$failures"
